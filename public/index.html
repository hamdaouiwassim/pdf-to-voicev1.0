<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF to Voice - Document Reader</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .fade-in {
            animation: fadeIn 0.3s ease-in;
        }
        .card-hover {
            transition: all 0.3s ease;
        }
        .card-hover:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
        }
    </style>
</head>
<body class="bg-gradient-to-br from-blue-50 via-indigo-50 to-purple-50 min-h-screen">
    <div class="container mx-auto px-4 py-8 max-w-7xl">
        <!-- Header -->
        <header class="text-center mb-12 fade-in">
            <h1 class="text-5xl font-bold text-gray-800 mb-3">
                <i class="fas fa-file-pdf text-red-500 mr-3"></i>
                PDF to Voice
            </h1>
            <p class="text-gray-600 text-lg">Upload PDFs, extract text, generate summaries, and convert to audio</p>
        </header>

        <!-- Upload Section -->
        <div class="bg-white rounded-2xl shadow-xl p-8 mb-8 fade-in">
            <h2 class="text-2xl font-semibold text-gray-800 mb-6 flex items-center">
                <i class="fas fa-cloud-upload-alt text-blue-500 mr-3"></i>
                Upload PDF Document
            </h2>
            
            <div class="border-2 border-dashed border-gray-300 rounded-xl p-8 text-center hover:border-blue-400 transition-colors">
                <input type="file" id="inpFile" accept=".pdf" class="hidden">
                <label for="inpFile" class="cursor-pointer">
                    <i class="fas fa-file-pdf text-6xl text-red-500 mb-4"></i>
                    <p class="text-gray-600 mb-2">Click to select a PDF file</p>
                    <p class="text-sm text-gray-400">Maximum file size: 10MB</p>
                </label>
                <div id="fileName" class="mt-4 text-blue-600 font-medium hidden"></div>
            </div>

            <button 
                type="button" 
                id="btnUpload" 
                class="w-full mt-6 bg-gradient-to-r from-blue-500 to-indigo-600 text-white py-3 px-6 rounded-lg font-semibold hover:from-blue-600 hover:to-indigo-700 transition-all transform hover:scale-105 shadow-lg disabled:opacity-50 disabled:cursor-not-allowed disabled:transform-none"
                disabled
            >
                <i class="fas fa-upload mr-2"></i>
                Upload and Extract Text
            </button>

            <!-- Loading Indicator -->
            <div id="uploadLoading" class="hidden mt-4">
                <div class="flex items-center justify-center">
                    <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-blue-500"></div>
                    <span class="ml-3 text-gray-600">Processing PDF...</span>
                </div>
            </div>

            <!-- Upload Result -->
            <div id="uploadResult" class="hidden mt-6 p-4 bg-green-50 border border-green-200 rounded-lg">
                <div class="flex items-center">
                    <i class="fas fa-check-circle text-green-500 mr-2"></i>
                    <span class="text-green-700 font-medium">Document uploaded successfully!</span>
                </div>
                <div id="uploadResultDetails" class="mt-2 text-sm text-gray-600"></div>
            </div>

            <!-- Error Message -->
            <div id="uploadError" class="hidden mt-6 p-4 bg-red-50 border border-red-200 rounded-lg">
                <div class="flex items-center">
                    <i class="fas fa-exclamation-circle text-red-500 mr-2"></i>
                    <span class="text-red-700 font-medium">Upload failed</span>
                </div>
                <div id="errorMessage" class="mt-2 text-sm text-red-600"></div>
            </div>
        </div>

        <!-- Extracted Text Section (Collapsible) -->
        <div id="extractedTextSection" class="bg-white rounded-2xl shadow-xl p-8 mb-8 hidden fade-in">
            <div class="flex items-center justify-between mb-4">
                <h2 class="text-2xl font-semibold text-gray-800 flex items-center">
                    <i class="fas fa-text-height text-purple-500 mr-3"></i>
                    Extracted Text
                </h2>
                <button id="closeTextBtn" class="text-gray-400 hover:text-gray-600">
                    <i class="fas fa-times text-xl"></i>
                </button>
            </div>
            <textarea 
                id="result" 
                class="w-full h-64 p-4 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent resize-none"
                readonly
            ></textarea>
        </div>

        <!-- Documents List Section -->
        <div class="bg-white rounded-2xl shadow-xl p-8 fade-in">
            <div class="flex items-center justify-between mb-6">
                <h2 class="text-2xl font-semibold text-gray-800 flex items-center">
                    <i class="fas fa-folder-open text-indigo-500 mr-3"></i>
                    All Documents
                </h2>
                <button 
                    id="refreshBtn" 
                    class="bg-gray-100 hover:bg-gray-200 text-gray-700 px-4 py-2 rounded-lg transition-colors flex items-center"
                >
                    <i class="fas fa-sync-alt mr-2"></i>
                    Refresh
                </button>
            </div>

            <!-- Loading State -->
            <div id="documentsLoading" class="text-center py-12">
                <div class="inline-block animate-spin rounded-full h-12 w-12 border-b-2 border-indigo-500"></div>
                <p class="mt-4 text-gray-600">Loading documents...</p>
            </div>

            <!-- Empty State -->
            <div id="emptyState" class="hidden text-center py-12">
                <i class="fas fa-inbox text-6xl text-gray-300 mb-4"></i>
                <p class="text-gray-500 text-lg">No documents found</p>
                <p class="text-gray-400 text-sm mt-2">Upload a PDF to get started</p>
            </div>

            <!-- Documents Grid -->
            <div id="documentsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 hidden">
                <!-- Documents will be inserted here -->
            </div>
        </div>
    </div>

    <!-- Document Modal -->
    <div id="documentModal" class="hidden fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl max-w-4xl w-full max-h-[90vh] overflow-y-auto">
            <div class="sticky top-0 bg-white border-b border-gray-200 px-6 py-4 flex items-center justify-between">
                <h3 id="modalTitle" class="text-2xl font-semibold text-gray-800"></h3>
                <button id="closeModalBtn" class="text-gray-400 hover:text-gray-600 text-2xl">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div id="modalContent" class="p-6">
                <!-- Modal content will be inserted here -->
            </div>
        </div>
    </div>

    <script>
        const inpFile = document.getElementById("inpFile");
        const btnUpload = document.getElementById("btnUpload");
        const result = document.getElementById("result");
        const fileName = document.getElementById("fileName");
        const uploadLoading = document.getElementById("uploadLoading");
        const uploadResult = document.getElementById("uploadResult");
        const uploadError = document.getElementById("uploadError");
        const errorMessage = document.getElementById("errorMessage");
        const uploadResultDetails = document.getElementById("uploadResultDetails");
        const extractedTextSection = document.getElementById("extractedTextSection");
        const closeTextBtn = document.getElementById("closeTextBtn");
        const documentsGrid = document.getElementById("documentsGrid");
        const documentsLoading = document.getElementById("documentsLoading");
        const emptyState = document.getElementById("emptyState");
        const refreshBtn = document.getElementById("refreshBtn");
        const documentModal = document.getElementById("documentModal");
        const modalTitle = document.getElementById("modalTitle");
        const modalContent = document.getElementById("modalContent");
        const closeModalBtn = document.getElementById("closeModalBtn");

        let currentDocId = null;

        // File input change handler
        inpFile.addEventListener("change", (e) => {
            if (e.target.files.length > 0) {
                const file = e.target.files[0];
                fileName.textContent = `Selected: ${file.name} (${(file.size / 1024 / 1024).toFixed(2)} MB)`;
                fileName.classList.remove("hidden");
                btnUpload.disabled = false;
            } else {
                fileName.classList.add("hidden");
                btnUpload.disabled = true;
            }
        });

        // Upload button click handler
        btnUpload.addEventListener("click", async () => {
            if (!inpFile.files[0]) {
                showError("Please select a PDF file first");
                return;
            }

            // Reset UI
            uploadResult.classList.add("hidden");
            uploadError.classList.add("hidden");
            uploadLoading.classList.remove("hidden");
            btnUpload.disabled = true;

            const formData = new FormData();
            formData.append("pdfFile", inpFile.files[0]);

            try {
                const response = await fetch("/api/documents", {
                    method: "POST",
                    body: formData
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || "Upload failed");
                }

                // Success
                uploadLoading.classList.add("hidden");
                uploadResult.classList.remove("hidden");
                uploadResultDetails.innerHTML = `
                    <strong>Document ID:</strong> ${data.docId}<br>
                    <strong>Filename:</strong> ${data.filename}<br>
                    <strong>Characters extracted:</strong> ${data.text?.length || 0}
                `;

                // Show extracted text
                result.value = data.text || "No text extracted";
                extractedTextSection.classList.remove("hidden");

                // Clear file input
                inpFile.value = "";
                fileName.classList.add("hidden");
                btnUpload.disabled = true;

                // Refresh documents list
                loadDocuments();
            } catch (error) {
                uploadLoading.classList.add("hidden");
                showError(error.message);
            }
        });

        // Close text section
        closeTextBtn.addEventListener("click", () => {
            extractedTextSection.classList.add("hidden");
        });

        // Show error message
        function showError(message) {
            errorMessage.textContent = message;
            uploadError.classList.remove("hidden");
            btnUpload.disabled = false;
        }

        // Load all documents
        async function loadDocuments() {
            documentsLoading.classList.remove("hidden");
            documentsGrid.classList.add("hidden");
            emptyState.classList.add("hidden");

            try {
                const response = await fetch("/api/documents");
                const documents = await response.json();

                documentsLoading.classList.add("hidden");

                if (documents.length === 0) {
                    emptyState.classList.remove("hidden");
                } else {
                    documentsGrid.classList.remove("hidden");
                    renderDocuments(documents);
                }
            } catch (error) {
                documentsLoading.classList.add("hidden");
                console.error("Error loading documents:", error);
                emptyState.classList.remove("hidden");
            }
        }

        // Render documents
        function renderDocuments(documents) {
            documentsGrid.innerHTML = documents.map(doc => `
                <div class="bg-gradient-to-br from-white to-gray-50 rounded-xl shadow-md card-hover p-6 border border-gray-200">
                    <div class="flex items-start justify-between mb-4">
                        <div class="flex-1">
                            <h3 class="text-lg font-semibold text-gray-800 mb-2 truncate" title="${doc.title}">
                                <i class="fas fa-file-pdf text-red-500 mr-2"></i>
                                ${doc.title || 'Untitled Document'}
                            </h3>
                            <p class="text-sm text-gray-500 mb-1">
                                <i class="fas fa-hashtag text-gray-400 mr-1"></i>
                                ${doc.id.substring(0, 8)}...
                            </p>
                            <p class="text-sm text-gray-500">
                                <i class="fas fa-font text-gray-400 mr-1"></i>
                                ${doc.length?.toLocaleString() || 0} characters
                            </p>
                        </div>
                    </div>
                    
                    <div class="flex flex-wrap gap-2 mt-4">
                        <button 
                            onclick="viewDocument('${doc.id}', '${doc.title}')" 
                            class="flex-1 bg-blue-500 hover:bg-blue-600 text-white text-sm py-2 px-3 rounded-lg transition-colors flex items-center justify-center"
                        >
                            <i class="fas fa-eye mr-1"></i>
                            View
                        </button>
                        <button 
                            onclick="getSummary('${doc.id}')" 
                            class="flex-1 bg-purple-500 hover:bg-purple-600 text-white text-sm py-2 px-3 rounded-lg transition-colors flex items-center justify-center"
                        >
                            <i class="fas fa-file-alt mr-1"></i>
                            Summary
                        </button>
                        <button 
                            onclick="generateTTS('${doc.id}')" 
                            class="flex-1 bg-green-500 hover:bg-green-600 text-white text-sm py-2 px-3 rounded-lg transition-colors flex items-center justify-center"
                        >
                            <i class="fas fa-volume-up mr-1"></i>
                            TTS
                        </button>
                    </div>
                    
                    <div class="mt-3 pt-3 border-t border-gray-200">
                        <a 
                            href="/api/documents/${doc.id}/file" 
                            target="_blank"
                            class="text-sm text-indigo-600 hover:text-indigo-700 flex items-center justify-center"
                        >
                            <i class="fas fa-download mr-1"></i>
                            Download PDF
                        </a>
                    </div>
                </div>
            `).join("");
        }

        // View document
        async function viewDocument(docId, title) {
            currentDocId = docId;
            modalTitle.textContent = title || "Document";
            modalContent.innerHTML = '<div class="text-center py-8"><div class="inline-block animate-spin rounded-full h-8 w-8 border-b-2 border-blue-500"></div><p class="mt-4 text-gray-600">Loading document...</p></div>';
            documentModal.classList.remove("hidden");

            try {
                const response = await fetch(`/api/documents/${docId}/file`);
                if (response.ok) {
                    const blob = await response.blob();
                    const url = URL.createObjectURL(blob);
                    modalContent.innerHTML = `
                        <iframe src="${url}" class="w-full h-[600px] border border-gray-300 rounded-lg"></iframe>
                    `;
                } else {
                    throw new Error("Failed to load document");
                }
            } catch (error) {
                modalContent.innerHTML = `
                    <div class="text-center py-8">
                        <i class="fas fa-exclamation-triangle text-4xl text-red-500 mb-4"></i>
                        <p class="text-red-600">Error loading document: ${error.message}</p>
                    </div>
                `;
            }
        }

        // Get summary
        async function getSummary(docId) {
            currentDocId = docId;
            modalTitle.textContent = "Document Summary";
            modalContent.innerHTML = '<div class="text-center py-8"><div class="inline-block animate-spin rounded-full h-8 w-8 border-b-2 border-purple-500"></div><p class="mt-4 text-gray-600">Generating summary...</p></div>';
            documentModal.classList.remove("hidden");

            try {
                const response = await fetch(`/api/documents/${docId}/summary?language=fr`);
                const data = await response.json();

                if (response.ok) {
                    modalContent.innerHTML = `
                        <div class="space-y-4">
                            <div class="bg-purple-50 border border-purple-200 rounded-lg p-4">
                                <h4 class="font-semibold text-purple-800 mb-2">
                                    <i class="fas fa-file-alt mr-2"></i>
                                    Summary
                                </h4>
                                <p class="text-gray-700 whitespace-pre-wrap">${data.summary || 'No summary available'}</p>
                            </div>
                            <div class="flex items-center justify-between text-sm text-gray-600">
                                <span>Original: ${data.originalLength?.toLocaleString() || 0} chars</span>
                                <span>Summary: ${data.summaryLength?.toLocaleString() || 0} chars</span>
                            </div>
                            ${data.audioData ? `
                                <div class="bg-green-50 border border-green-200 rounded-lg p-4">
                                    <h4 class="font-semibold text-green-800 mb-3">
                                        <i class="fas fa-volume-up mr-2"></i>
                                        Audio
                                    </h4>
                                    <audio controls class="w-full">
                                        <source src="data:audio/wav;base64,${data.audioData}" type="audio/wav">
                                        Your browser does not support the audio element.
                                    </audio>
                                </div>
                            ` : ''}
                        </div>
                    `;
                } else {
                    throw new Error(data.error || "Failed to generate summary");
                }
            } catch (error) {
                modalContent.innerHTML = `
                    <div class="text-center py-8">
                        <i class="fas fa-exclamation-triangle text-4xl text-red-500 mb-4"></i>
                        <p class="text-red-600">Error: ${error.message}</p>
                    </div>
                `;
            }
        }

        // Generate TTS
        async function generateTTS(docId) {
            currentDocId = docId;
            modalTitle.textContent = "Text-to-Speech Audio";
            modalContent.innerHTML = '<div class="text-center py-8"><div class="inline-block animate-spin rounded-full h-8 w-8 border-b-2 border-green-500"></div><p class="mt-4 text-gray-600">Generating audio...</p></div>';
            documentModal.classList.remove("hidden");

            try {
                const response = await fetch("/api/tts", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ docId })
                });

                const data = await response.json();

                if (response.ok) {
                    modalContent.innerHTML = `
                        <div class="space-y-4">
                            <div class="bg-green-50 border border-green-200 rounded-lg p-4">
                                <h4 class="font-semibold text-green-800 mb-3">
                                    <i class="fas fa-volume-up mr-2"></i>
                                    Audio Generated
                                </h4>
                                <audio controls class="w-full">
                                    <source src="data:audio/wav;base64,${data.audioData}" type="audio/wav">
                                    Your browser does not support the audio element.
                                </audio>
                            </div>
                            <div class="text-sm text-gray-600 space-y-1">
                                <p><strong>Text Length:</strong> ${data.textLength?.toLocaleString() || 0} characters</p>
                                <p><strong>Audio Size:</strong> ${data.audioLength ? (data.audioLength / 1024).toFixed(2) + ' KB' : 'N/A'}</p>
                                <p><strong>Cached:</strong> ${data.cached ? 'Yes' : 'No'}</p>
                            </div>
                        </div>
                    `;
                } else {
                    throw new Error(data.error || "Failed to generate audio");
                }
            } catch (error) {
                modalContent.innerHTML = `
                    <div class="text-center py-8">
                        <i class="fas fa-exclamation-triangle text-4xl text-red-500 mb-4"></i>
                        <p class="text-red-600">Error: ${error.message}</p>
                    </div>
                `;
            }
        }

        // Close modal
        closeModalBtn.addEventListener("click", () => {
            documentModal.classList.add("hidden");
        });

        // Close modal on outside click
        documentModal.addEventListener("click", (e) => {
            if (e.target === documentModal) {
                documentModal.classList.add("hidden");
            }
        });

        // Refresh documents
        refreshBtn.addEventListener("click", loadDocuments);

        // Load documents on page load
        loadDocuments();
    </script>
</body>
</html>
