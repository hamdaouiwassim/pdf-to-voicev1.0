<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Final Project Management - Titan Academy</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .fade-in {
            animation: fadeIn 0.3s ease-in;
        }
    </style>
</head>

<body class="bg-gradient-to-br from-blue-50 via-indigo-50 to-purple-50 min-h-screen">
    <!-- Navbar -->
    <nav class="bg-white shadow-lg mb-8">
        <div class="container mx-auto px-4 py-4">
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-6">
                    <a href="/index.html"
                        class="flex items-center gap-2 text-gray-800 hover:text-indigo-600 transition-colors">
                        <img src="/logo.png" alt="Titan Academy" class="h-8 w-auto">
                        <span class="text-xl font-bold">Titan Academy</span>
                    </a>
                    <a href="/index.html"
                        class="px-4 py-2 text-indigo-600 bg-indigo-50 rounded-lg font-semibold flex items-center gap-2">
                        <i class="fas fa-arrow-left"></i>
                        Back to Courses
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <div class="container mx-auto px-4 py-8">
        <div class="max-w-4xl mx-auto">
            <div class="bg-white rounded-2xl shadow-xl p-8 fade-in">
                <div class="mb-6">
                    <h1 class="text-3xl font-bold text-gray-800 mb-2">
                        <i class="fas fa-project-diagram text-orange-500 mr-3"></i>
                        Final Project Management
                    </h1>
                    <p class="text-gray-600" id="courseInfo">Loading course information...</p>
                </div>

                <!-- Final Project Info Section -->
                <div id="finalProjectInfoSection" class="mb-6">
                    <div id="noFinalProjectState" class="hidden">
                        <p class="text-gray-600 mb-4">No final project exists for this course. Create one to add documents.</p>
                        <div class="space-y-4">
                            <div>
                                <label class="block text-sm font-semibold text-gray-700 mb-2">
                                    Project Name <span class="text-red-500">*</span>
                                </label>
                                <input type="text" id="inpProjectName" maxlength="255"
                                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-orange-500 focus:border-transparent"
                                    placeholder="Enter project name">
                            </div>
                            <div>
                                <label class="block text-sm font-semibold text-gray-700 mb-2">
                                    Project Description
                                </label>
                                <textarea id="inpProjectDescription" rows="3" maxlength="2000"
                                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-orange-500 focus:border-transparent resize-none"
                                    placeholder="Enter project description"></textarea>
                            </div>
                            <button id="btnCreateFinalProject"
                                class="w-full bg-gradient-to-r from-orange-500 to-red-600 text-white font-semibold py-3 px-6 rounded-lg hover:from-orange-600 hover:to-red-700 transition-all transform hover:scale-105 shadow-lg">
                                <i class="fas fa-plus mr-2"></i>
                                Create Final Project
                            </button>
                        </div>
                    </div>
                    <div id="finalProjectExistsState" class="hidden">
                        <div class="bg-green-50 border border-green-200 rounded-lg p-4 mb-4">
                            <div class="flex items-center justify-between">
                                <div>
                                    <h4 class="font-semibold text-green-800" id="displayProjectName"></h4>
                                    <p class="text-sm text-green-600 mt-1" id="displayProjectDescription"></p>
                                </div>
                                <button id="btnEditFinalProject" class="text-orange-600 hover:text-orange-800 p-2 rounded-lg hover:bg-orange-50 transition-colors">
                                    <i class="fas fa-edit"></i>
                                </button>
                            </div>
                        </div>
                        <div id="editFinalProjectForm" class="hidden space-y-4 mb-4">
                            <div>
                                <label class="block text-sm font-semibold text-gray-700 mb-2">
                                    Project Name <span class="text-red-500">*</span>
                                </label>
                                <input type="text" id="inpEditProjectName" maxlength="255"
                                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-orange-500 focus:border-transparent">
                            </div>
                            <div>
                                <label class="block text-sm font-semibold text-gray-700 mb-2">
                                    Project Description
                                </label>
                                <textarea id="inpEditProjectDescription" rows="3" maxlength="2000"
                                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-orange-500 focus:border-transparent resize-none"></textarea>
                            </div>
                            <div class="flex gap-3">
                                <button id="btnUpdateFinalProject"
                                    class="flex-1 bg-gradient-to-r from-orange-500 to-red-600 text-white font-semibold py-2 px-4 rounded-lg hover:from-orange-600 hover:to-red-700 transition-all">
                                    <i class="fas fa-save mr-2"></i>
                                    Update
                                </button>
                                <button id="btnCancelEditFinalProject"
                                    class="flex-1 bg-gray-300 hover:bg-gray-400 text-gray-800 font-semibold py-2 px-4 rounded-lg transition-colors">
                                    Cancel
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Documents Section -->
                <div id="documentsSection" class="hidden">
                    <div class="flex items-center justify-between mb-4">
                        <h4 class="text-xl font-semibold text-gray-800">Documents</h4>
                        <button id="btnAddDocument"
                            class="bg-gradient-to-r from-indigo-500 to-purple-600 text-white font-semibold py-2 px-4 rounded-lg hover:from-indigo-600 hover:to-purple-700 transition-all transform hover:scale-105 shadow-lg flex items-center gap-2">
                            <i class="fas fa-plus"></i>
                            Add Document
                        </button>
                    </div>

                    <!-- Add Document Form -->
                    <div id="addDocumentForm" class="hidden bg-gray-50 rounded-lg p-4 mb-4 space-y-4">
                        <div>
                            <label class="block text-sm font-semibold text-gray-700 mb-2">
                                Document Name <span class="text-red-500">*</span>
                            </label>
                            <input type="text" id="inpDocumentName" maxlength="255"
                                class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
                                placeholder="Enter document name">
                        </div>
                        <div>
                            <label class="block text-sm font-semibold text-gray-700 mb-2">
                                Document Description
                            </label>
                            <textarea id="inpDocumentDescription" rows="2" maxlength="1000"
                                class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent resize-none"
                                placeholder="Enter document description"></textarea>
                        </div>
                        <div>
                            <label class="block text-sm font-semibold text-gray-700 mb-2">
                                PDF File <span class="text-red-500">*</span>
                            </label>
                            <div class="border-2 border-dashed border-gray-300 rounded-xl p-6 text-center hover:border-indigo-400 transition-colors">
                                <input type="file" id="inpDocumentPdf" accept=".pdf" class="hidden">
                                <label for="inpDocumentPdf" class="cursor-pointer">
                                    <i class="fas fa-file-pdf text-4xl text-red-500 mb-2"></i>
                                    <p class="text-gray-700 font-medium mb-1">Click to select PDF file</p>
                                    <p class="text-sm text-gray-500">Maximum file size: 50MB</p>
                                </label>
                                <div id="documentPdfPreview" class="hidden mt-4">
                                    <div class="bg-indigo-50 border border-indigo-200 rounded-lg p-3 flex items-center justify-between">
                                        <div class="flex items-center gap-3">
                                            <i class="fas fa-file-pdf text-red-500 text-2xl"></i>
                                            <div>
                                                <p class="text-sm font-medium text-gray-800" id="documentPdfFileName"></p>
                                                <p class="text-xs text-gray-500" id="documentPdfFileSize"></p>
                                            </div>
                                        </div>
                                        <button type="button" id="btnRemoveDocumentPdf" class="text-red-500 hover:text-red-700 px-2 py-1 rounded hover:bg-red-50">
                                            <i class="fas fa-times"></i>
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="flex gap-3">
                            <button id="btnSaveDocument"
                                class="flex-1 bg-gradient-to-r from-indigo-500 to-purple-600 text-white font-semibold py-2 px-4 rounded-lg hover:from-indigo-600 hover:to-purple-700 transition-all">
                                <i class="fas fa-save mr-2"></i>
                                Save Document
                            </button>
                            <button id="btnCancelAddDocument"
                                class="flex-1 bg-gray-300 hover:bg-gray-400 text-gray-800 font-semibold py-2 px-4 rounded-lg transition-colors">
                                Cancel
                            </button>
                        </div>
                    </div>

                    <!-- Documents List -->
                    <div id="documentsList" class="space-y-3">
                        <!-- Documents will be inserted here -->
                    </div>
                    <div id="documentsEmptyState" class="hidden text-center py-8">
                        <i class="fas fa-file-pdf text-4xl text-gray-300 mb-2"></i>
                        <p class="text-gray-500">No documents yet</p>
                        <p class="text-gray-400 text-sm mt-1">Add a document to get started</p>
                    </div>
                </div>

                <div id="finalProjectResult" class="hidden mt-4"></div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = window.location.origin;
        let currentCourseId = null;
        let currentFinalProject = null;
        let currentEditingDocumentId = null;

        // Get URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        currentCourseId = urlParams.get('courseId');

        if (!currentCourseId) {
            alert('Course ID is required');
            window.location.href = '/index.html';
        }

        // Check authentication
        async function checkAuthentication() {
            try {
                const response = await fetch(`${API_BASE}/api/auth/status`, {
                    credentials: 'include'
                });
                const data = await response.json();
                if (!data.authenticated) {
                    window.location.href = '/login.html';
                    return false;
                }
                return true;
            } catch (error) {
                window.location.href = '/login.html';
                return false;
            }
        }

        // Load course info
        async function loadCourseInfo() {
            try {
                const response = await fetch(`${API_BASE}/api/courses/${currentCourseId}`, {
                    credentials: 'include'
                });
                if (response.ok) {
                    const course = await response.json();
                    document.getElementById('courseInfo').textContent = `Course: ${course.courseName}`;
                }
            } catch (error) {
                console.error('Error loading course:', error);
            }
        }

        // Load final project
        async function loadFinalProject() {
            try {
                const response = await fetch(`${API_BASE}/api/courses/${currentCourseId}/final-project`, {
                    credentials: 'include'
                });
                
                if (response.ok) {
                    currentFinalProject = await response.json();
                    updateFinalProjectUI();
                } else if (response.status === 404) {
                    currentFinalProject = null;
                    updateFinalProjectUI();
                } else {
                    throw new Error('Failed to load final project');
                }
            } catch (error) {
                console.error('Error loading final project:', error);
                currentFinalProject = null;
                updateFinalProjectUI();
            }
        }

        // Update UI based on final project state
        function updateFinalProjectUI() {
            if (currentFinalProject) {
                document.getElementById('noFinalProjectState').classList.add('hidden');
                document.getElementById('finalProjectExistsState').classList.remove('hidden');
                document.getElementById('documentsSection').classList.remove('hidden');
                
                document.getElementById('displayProjectName').textContent = currentFinalProject.projectName || 'Untitled Project';
                document.getElementById('displayProjectDescription').textContent = currentFinalProject.projectDescription || 'No description';
                loadDocuments();
            } else {
                document.getElementById('noFinalProjectState').classList.remove('hidden');
                document.getElementById('finalProjectExistsState').classList.add('hidden');
                document.getElementById('documentsSection').classList.add('hidden');
            }
        }

        // Create final project
        document.getElementById('btnCreateFinalProject').addEventListener('click', async () => {
            const projectName = document.getElementById('inpProjectName').value.trim();
            const projectDescription = document.getElementById('inpProjectDescription').value.trim();

            if (!projectName) {
                showFinalProjectError('Project name is required');
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/api/courses/${currentCourseId}/final-project`, {
                    method: 'POST',
                    credentials: 'include',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ projectName, projectDescription })
                });

                const data = await response.json();

                if (response.ok) {
                    currentFinalProject = data;
                    updateFinalProjectUI();
                    showFinalProjectSuccess('Final project created successfully!');
                    document.getElementById('inpProjectName').value = '';
                    document.getElementById('inpProjectDescription').value = '';
                } else {
                    showFinalProjectError(data.error || 'Failed to create final project');
                }
            } catch (error) {
                showFinalProjectError('Error creating final project: ' + error.message);
            }
        });

        // Edit final project button
        document.getElementById('btnEditFinalProject').addEventListener('click', () => {
            document.getElementById('editFinalProjectForm').classList.remove('hidden');
            document.getElementById('inpEditProjectName').value = currentFinalProject.projectName || '';
            document.getElementById('inpEditProjectDescription').value = currentFinalProject.projectDescription || '';
        });

        // Cancel edit
        document.getElementById('btnCancelEditFinalProject').addEventListener('click', () => {
            document.getElementById('editFinalProjectForm').classList.add('hidden');
        });

        // Update final project
        document.getElementById('btnUpdateFinalProject').addEventListener('click', async () => {
            const projectName = document.getElementById('inpEditProjectName').value.trim();
            const projectDescription = document.getElementById('inpEditProjectDescription').value.trim();

            if (!projectName) {
                showFinalProjectError('Project name is required');
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/api/courses/${currentCourseId}/final-project`, {
                    method: 'PUT',
                    credentials: 'include',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ projectName, projectDescription })
                });

                const data = await response.json();

                if (response.ok) {
                    currentFinalProject = { ...currentFinalProject, ...data };
                    updateFinalProjectUI();
                    document.getElementById('editFinalProjectForm').classList.add('hidden');
                    showFinalProjectSuccess('Final project updated successfully!');
                } else {
                    showFinalProjectError(data.error || 'Failed to update final project');
                }
            } catch (error) {
                showFinalProjectError('Error updating final project: ' + error.message);
            }
        });

        // Add document button
        document.getElementById('btnAddDocument').addEventListener('click', () => {
            document.getElementById('addDocumentForm').classList.remove('hidden');
            currentEditingDocumentId = null;
            clearDocumentForm();
        });

        // Cancel add document
        document.getElementById('btnCancelAddDocument').addEventListener('click', () => {
            document.getElementById('addDocumentForm').classList.add('hidden');
            clearDocumentForm();
        });

        // PDF file preview
        document.getElementById('inpDocumentPdf').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                document.getElementById('documentPdfFileName').textContent = file.name;
                document.getElementById('documentPdfFileSize').textContent = `${(file.size / 1024 / 1024).toFixed(2)} MB`;
                document.getElementById('documentPdfPreview').classList.remove('hidden');
            }
        });

        document.getElementById('btnRemoveDocumentPdf').addEventListener('click', () => {
            document.getElementById('inpDocumentPdf').value = '';
            document.getElementById('documentPdfPreview').classList.add('hidden');
        });

        // Save document
        document.getElementById('btnSaveDocument').addEventListener('click', async () => {
            const documentName = document.getElementById('inpDocumentName').value.trim();
            const documentDescription = document.getElementById('inpDocumentDescription').value.trim();
            const pdfFile = document.getElementById('inpDocumentPdf').files[0];

            if (!documentName) {
                showFinalProjectError('Document name is required');
                return;
            }

            if (!pdfFile) {
                showFinalProjectError('PDF file is required');
                return;
            }

            if (pdfFile.type !== 'application/pdf') {
                showFinalProjectError('File must be a PDF');
                return;
            }

            try {
                const formData = new FormData();
                formData.append('documentName', documentName);
                formData.append('documentDescription', documentDescription);
                formData.append('pdfResource', pdfFile);

                const response = await fetch(`${API_BASE}/api/courses/${currentCourseId}/final-project/documents`, {
                    method: 'POST',
                    credentials: 'include',
                    body: formData
                });

                const data = await response.json();

                if (response.ok) {
                    showFinalProjectSuccess('Document added successfully!');
                    document.getElementById('addDocumentForm').classList.add('hidden');
                    clearDocumentForm();
                    await loadFinalProject();
                } else {
                    showFinalProjectError(data.error || 'Failed to add document');
                }
            } catch (error) {
                showFinalProjectError('Error adding document: ' + error.message);
            }
        });

        // Load documents
        async function loadDocuments() {
            if (!currentFinalProject || !currentFinalProject.documents) {
                document.getElementById('documentsList').innerHTML = '';
                document.getElementById('documentsEmptyState').classList.remove('hidden');
                return;
            }

            const documents = currentFinalProject.documents;
            const documentsList = document.getElementById('documentsList');
            const emptyState = document.getElementById('documentsEmptyState');

            if (documents.length === 0) {
                documentsList.innerHTML = '';
                emptyState.classList.remove('hidden');
                return;
            }

            emptyState.classList.add('hidden');
            documentsList.innerHTML = documents.map(doc => `
                <div class="bg-white border border-gray-200 rounded-lg p-4 flex items-center justify-between hover:shadow-md transition-shadow">
                    <div class="flex-1">
                        <h5 class="font-semibold text-gray-800">${escapeHtml(doc.documentName)}</h5>
                        ${doc.documentDescription ? `<p class="text-sm text-gray-600 mt-1">${escapeHtml(doc.documentDescription)}</p>` : ''}
                    </div>
                    <div class="flex items-center gap-2">
                        <a href="${API_BASE}/api/courses/${currentCourseId}/final-project/documents/${doc.id}/pdf" 
                           target="_blank"
                           class="text-indigo-600 hover:text-indigo-800 px-3 py-2 rounded-lg hover:bg-indigo-50 transition-colors flex items-center gap-2">
                            <i class="fas fa-download"></i>
                            View PDF
                        </a>
                        <button onclick="deleteDocument('${doc.id}')" 
                                class="text-red-600 hover:text-red-800 px-3 py-2 rounded-lg hover:bg-red-50 transition-colors flex items-center gap-2">
                            <i class="fas fa-trash"></i>
                            Delete
                        </button>
                    </div>
                </div>
            `).join('');
        }

        // Delete document
        window.deleteDocument = async function(documentId) {
            if (!confirm('Are you sure you want to delete this document?')) {
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/api/courses/${currentCourseId}/final-project/documents/${documentId}`, {
                    method: 'DELETE',
                    credentials: 'include'
                });

                const data = await response.json();

                if (response.ok) {
                    showFinalProjectSuccess('Document deleted successfully!');
                    await loadFinalProject();
                } else {
                    showFinalProjectError(data.error || 'Failed to delete document');
                }
            } catch (error) {
                showFinalProjectError('Error deleting document: ' + error.message);
            }
        };

        function clearDocumentForm() {
            document.getElementById('inpDocumentName').value = '';
            document.getElementById('inpDocumentDescription').value = '';
            document.getElementById('inpDocumentPdf').value = '';
            document.getElementById('documentPdfPreview').classList.add('hidden');
        }

        function showFinalProjectSuccess(message) {
            const resultDiv = document.getElementById('finalProjectResult');
            resultDiv.classList.remove('hidden');
            resultDiv.className = 'mt-4 p-4 bg-green-50 border border-green-200 rounded-lg text-green-700';
            resultDiv.innerHTML = `
                <div class="flex items-center">
                    <i class="fas fa-check-circle mr-2"></i>
                    <span>${escapeHtml(message)}</span>
                </div>
            `;
            setTimeout(() => {
                resultDiv.classList.add('hidden');
            }, 3000);
        }

        function showFinalProjectError(message) {
            const resultDiv = document.getElementById('finalProjectResult');
            resultDiv.classList.remove('hidden');
            resultDiv.className = 'mt-4 p-4 bg-red-50 border border-red-200 rounded-lg text-red-700';
            resultDiv.innerHTML = `
                <div class="flex items-center">
                    <i class="fas fa-exclamation-circle mr-2"></i>
                    <span>${escapeHtml(message)}</span>
                </div>
            `;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Initialize on page load
        (async () => {
            if (await checkAuthentication()) {
                await loadCourseInfo();
                await loadFinalProject();
            }
        })();
    </script>
</body>

</html>
