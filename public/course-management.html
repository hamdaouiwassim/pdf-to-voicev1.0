<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Management - Titan Academy</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .fade-in {
            animation: fadeIn 0.3s ease-in;
        }
    </style>
</head>

<body class="bg-gradient-to-br from-blue-50 via-indigo-50 to-purple-50 min-h-screen">
    <!-- Navbar -->
    <nav class="bg-white shadow-lg mb-8">
        <div class="container mx-auto px-4 py-4">
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-6">
                    <a href="/index.html"
                        class="flex items-center gap-2 text-gray-800 hover:text-indigo-600 transition-colors">
                        <img src="/logo.png" alt="Titan Academy" class="h-8 w-auto">
                        <span class="text-xl font-bold">Titan Academy</span>
                    </a>
                    <a href="/index.html"
                        class="px-4 py-2 text-indigo-600 bg-indigo-50 rounded-lg font-semibold flex items-center gap-2">
                        <i class="fas fa-arrow-left"></i>
                        Back to Courses
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <div class="container mx-auto px-4 py-8">
        <div class="max-w-4xl mx-auto">
            <div class="bg-white rounded-2xl shadow-xl p-8 fade-in">
                <div class="mb-6">
                    <h1 class="text-3xl font-bold text-gray-800 mb-2">
                        <i class="fas fa-book text-indigo-500 mr-3"></i>
                        <span id="pageTitle">Create New Course</span>
                    </h1>
                    <p class="text-gray-600">Fill in the details below to create or edit a course</p>
                </div>

                <div class="space-y-6">
                    <div>
                        <label for="inpCourseName" class="block text-sm font-semibold text-gray-700 mb-2">
                            Course Name <span class="text-red-500">*</span>
                        </label>
                        <input type="text" id="inpCourseName" maxlength="150"
                            class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                            placeholder="e.g. Artificial Intelligence Fundamentals" />
                    </div>

                    <div>
                        <label for="inpCourseDescription" class="block text-sm font-semibold text-gray-700 mb-2">
                            Course Description <span class="text-red-500">*</span>
                        </label>
                        <textarea id="inpCourseDescription" rows="6" maxlength="2000"
                            class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:ring-2 focus:ring-blue-500 focus:border-transparent resize-none"
                            placeholder="Describe the course content..."></textarea>
                    </div>

                    <div>
                        <label for="inpCourseImage" class="block text-sm font-semibold text-gray-700 mb-2">
                            <i class="fas fa-image text-purple-500 mr-2"></i>
                            Course Image (optional)
                        </label>
                        <input type="file" id="inpCourseImage"
                            accept="image/jpeg,image/jpg,image/png,image/webp,image/gif"
                            class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:ring-2 focus:ring-purple-500 focus:border-transparent" />
                        <p class="text-xs text-gray-500 mt-1">Accepted formats: JPEG, PNG, WebP, GIF (max 5MB)</p>
                        <div id="courseImagePreview" class="hidden mt-2">
                            <img id="courseImagePreviewImg" src="" alt="Course image preview"
                                class="max-w-full h-32 object-cover rounded-lg border border-gray-300" />
                        </div>
                    </div>

                    <div class="flex gap-4">
                        <button type="button" id="btnSaveCourse"
                            class="flex-1 bg-gradient-to-r from-blue-500 to-indigo-600 text-white py-3 px-6 rounded-lg font-semibold hover:from-blue-600 hover:to-indigo-700 transition-all transform hover:scale-105 shadow-lg disabled:opacity-50 disabled:cursor-not-allowed">
                            <i class="fas fa-save mr-2"></i>
                            <span id="btnSaveCourseText">Create Course</span>
                        </button>
                        <button type="button" id="btnCancel"
                            onclick="window.location.href='/index.html'"
                            class="px-6 py-3 border-2 border-gray-300 text-gray-700 rounded-lg font-semibold hover:bg-gray-50 transition-colors">
                            Cancel
                        </button>
                    </div>

                    <div id="courseResult" class="hidden mt-4"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = window.location.origin;
        let currentEditingCourseId = null;

        // Get URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        const courseId = urlParams.get('courseId');
        const mode = urlParams.get('mode') || 'create';

        // Load course data if editing
        if (mode === 'edit' && courseId) {
            currentEditingCourseId = courseId;
            document.getElementById('pageTitle').textContent = 'Edit Course';
            document.getElementById('btnSaveCourseText').textContent = 'Update Course';
            loadCourseData(courseId);
        }

        // Check authentication
        async function checkAuthentication() {
            try {
                const response = await fetch(`${API_BASE}/api/auth/status`, {
                    credentials: 'include'
                });
                const data = await response.json();
                if (!data.authenticated) {
                    window.location.href = '/login.html';
                    return false;
                }
                return true;
            } catch (error) {
                window.location.href = '/login.html';
                return false;
            }
        }

        // Check auth on page load
        checkAuthentication();

        async function loadCourseData(courseId) {
            try {
                const response = await fetch(`${API_BASE}/api/courses/${courseId}`, {
                    credentials: 'include'
                });
                if (!response.ok) {
                    throw new Error('Failed to load course');
                }
                const course = await response.json();
                document.getElementById('inpCourseName').value = course.courseName || '';
                document.getElementById('inpCourseDescription').value = course.courseDescription || '';
                if (course.imageUrl) {
                    document.getElementById('courseImagePreview').classList.remove('hidden');
                    document.getElementById('courseImagePreviewImg').src = course.imageUrl;
                }
            } catch (error) {
                showResult('error', 'Failed to load course: ' + error.message);
            }
        }

        // Image preview
        document.getElementById('inpCourseImage').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    document.getElementById('courseImagePreview').classList.remove('hidden');
                    document.getElementById('courseImagePreviewImg').src = e.target.result;
                };
                reader.readAsDataURL(file);
            }
        });

        // Save course
        document.getElementById('btnSaveCourse').addEventListener('click', async () => {
            const courseName = document.getElementById('inpCourseName').value.trim();
            const courseDescription = document.getElementById('inpCourseDescription').value.trim();
            const courseImage = document.getElementById('inpCourseImage').files[0];

            if (!courseName) {
                showResult('error', 'Course name is required');
                return;
            }

            if (!courseDescription) {
                showResult('error', 'Course description is required');
                return;
            }

            const btn = document.getElementById('btnSaveCourse');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>Saving...';

            try {
                const formData = new FormData();
                formData.append('courseName', courseName);
                formData.append('courseDescription', courseDescription);
                if (courseImage) {
                    formData.append('courseImage', courseImage);
                }

                const url = currentEditingCourseId 
                    ? `${API_BASE}/api/courses/${currentEditingCourseId}`
                    : `${API_BASE}/api/courses`;
                const method = currentEditingCourseId ? 'PUT' : 'POST';

                const response = await fetch(url, {
                    method,
                    credentials: 'include',
                    body: formData
                });

                const data = await response.json();

                if (response.ok) {
                    showResult('success', currentEditingCourseId ? 'Course updated successfully!' : 'Course created successfully!');
                    setTimeout(() => {
                        window.location.href = '/index.html';
                    }, 1500);
                } else {
                    showResult('error', data.error || 'Failed to save course');
                    btn.disabled = false;
                    btn.innerHTML = `<i class="fas fa-save mr-2"></i><span>${currentEditingCourseId ? 'Update' : 'Create'} Course</span>`;
                }
            } catch (error) {
                showResult('error', 'Error: ' + error.message);
                btn.disabled = false;
                btn.innerHTML = `<i class="fas fa-save mr-2"></i><span>${currentEditingCourseId ? 'Update' : 'Create'} Course</span>`;
            }
        });

        function showResult(type, message) {
            const resultDiv = document.getElementById('courseResult');
            resultDiv.classList.remove('hidden');
            resultDiv.className = `mt-4 p-4 rounded-lg ${type === 'success' ? 'bg-green-50 border border-green-200 text-green-700' : 'bg-red-50 border border-red-200 text-red-700'}`;
            resultDiv.innerHTML = `
                <div class="flex items-center">
                    <i class="fas ${type === 'success' ? 'fa-check-circle' : 'fa-exclamation-circle'} mr-2"></i>
                    <span>${message}</span>
                </div>
            `;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>

</html>
